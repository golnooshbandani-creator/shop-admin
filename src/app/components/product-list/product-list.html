<section class="products-section">
    <h2>Products</h2>

    <form class="product-form" (submit)="$event.preventDefault();addProduct()">
        <input type="text" placeholder="Product name" [value]="newProductName()"
            (input)="newProductName.set($any($event.target).value)" />

        <input type="number" placeholder="Price" min="0.01" step="0.01" [value]="newProductPrice()??''"
            (input)="newProductPrice.set($any($event.target).value===''? null : Number($any($event.target).value))" />

        <button type="submit">Add Product</button>
    </form>

    <input type="text" placeholder="Search products..." [value]="searchTerm()"
        (input)="searchTerm.set($any($event.target).value)" class="search-input" />

    <select [value]="sortOrder()" (change)="sortOrder.set($any($event.target).value)" class="sort-select">
        <option value="default">Default order</option>
        <option value="low">Price: Low to High</option>
        <option value="high">Price: High to Low</option>
    </select>

    @for(product of filteredProducts(); track product.id){
    <article class="products-row">
        @if (editingProductId() === product.id) {
        <div class="edit-form">
            <input type="text" placeholder="Product name" [value]="editProductName()"
                (input)="editProductName.set($any($event.target).value)" />

            <input type="number" placeholder="Price" min="0.01" step="0.01" [value]="editProductPrice() ?? ''"
                (input)="editProductPrice.set($any($event.target).value === '' ? null : Number($any($event.target).value))" />

            <button type="button" (click)="saveEdit()">Save</button>
            <button type="button" (click)="cancelEdit()">Cancel</button>
        </div>
        } @else {
        <span>{{ product.name }}</span>

        <div class="product-actions">
            <span>${{ product.price }}</span>

            <button type="button" class="edit-button" (click)="startEdit(product)">
                Edit
            </button>

            <button type="button" class="delete-button" (click)="deleteProduct(product.id)">
                Delete
            </button>
        </div>
        }
    </article>
    }@empty{
    <p>No products available</p>
    }
</section>
